name: Career page snapshots CI

on:
  pull_request:
    paths:
      - pj__career-page-snapshots/**
      - .github/workflows/career-page-snapshots-ci.yml
      - .github/workflows/career-page-snapshots-deploy.yml
  push:
    branches:
      - main
    paths:
      - pj__career-page-snapshots/**
      - .github/workflows/career-page-snapshots-ci.yml
      - .github/workflows/career-page-snapshots-deploy.yml

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: career_page_snapshots_test
          POSTGRES_USER: career_page_snapshots
          POSTGRES_PASSWORD: career_page_snapshots
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career_page_snapshots -d career_page_snapshots_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: pj__career-page-snapshots
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pj__career-page-snapshots/uv.lock

      - name: Install locked environment
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        env:
          PREFECT_HOME: ${{ runner.temp }}/prefect
        run: uv run pytest -m "not integration"

      - name: Test migrations and persistence
        env:
          TEST_DATABASE_URL: >-
            postgresql://career_page_snapshots:career_page_snapshots@127.0.0.1:5432/career_page_snapshots_test
        run: uv run pytest -m integration

      - name: Validate Prefect metadata offline
        env:
          PREFECT_HOME: ${{ runner.temp }}/prefect
        run: uv run career-page-snapshots-deployment validate

      - name: Build and smoke-test application image
        run: |
          docker build --tag career-page-snapshots:ci .
          docker run --rm career-page-snapshots:ci python -c "import career_page_snapshots"
