name: Fantasy football ingestion CI

on:
  pull_request:
    paths:
      - pj__fantasy-football-ingestion/**
      - .github/workflows/fantasy-football-ingestion-ci.yml
  push:
    branches:
      - main
    paths:
      - pj__fantasy-football-ingestion/**
      - .github/workflows/fantasy-football-ingestion-ci.yml

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pj__fantasy-football-ingestion
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pj__fantasy-football-ingestion/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test imports and project configuration
        run: uv run pytest
