# Convention only — not a table inventory.
# pj__captains-log → captains_log.landing.<table>
#
# folder_prefix stripped, hyphens → underscores, then:
#   database:        {project}          (Neon / prod)
#   local_database:  {project}_dev      (local Postgres)
#   default_schema:  landing
folder_prefix: pj__
database: "{project}"
local_database: "{project}_dev"
default_schema: landing
